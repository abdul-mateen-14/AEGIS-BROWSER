<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis Browser — Liquid Glass Dock · UI Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AEGIS BROWSER — "LIQUID GLASS DOCK" UI CONCEPT
   Zero-chrome mobile browsing · monochrome liquid glass
   Baseline viewport: 412 × 924 dp (Pixel-class)
   ============================================================ */
:root{
  /* Aegis dark-theme UI tokens (dp = px at 1x phone scale) */
  --a-bg-dark:#0A0A0B; --a-surface-dark:#141416;
  --a-text-dark:#F4F4F5; --a-text2-dark:#A1A1AA; --a-text3-dark:#63636B;
  --a-line-dark:rgba(255,255,255,.10);
  --a-glass-bg-dark:rgba(16,16,18,.52);
  --a-glass-brd-dark:rgba(255,255,255,.14);
  --a-glass-hi-dark:rgba(255,255,255,.10);
  /* Aegis light-theme UI tokens */
  --a-bg-light:#F6F6F7; --a-surface-light:#FFFFFF;
  --a-text-light:#101013; --a-text2-light:#52525B; --a-text3-light:#8E8E96;
  --a-line-light:rgba(10,10,12,.08);
  --a-glass-bg-light:rgba(255,255,255,.62);
  --a-glass-brd-light:rgba(10,10,12,.12);
  --a-glass-hi-light:rgba(255,255,255,.55);
  /* Document (proposal) neutrals — from cascade palette */
  --ink:#151617; --ink2:#475666; --muted:#80858A; --hairline:#B2BFCC;
  --paper:#F0F0F1; --card:#E9EBED;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Montserrat','Segoe UI',system-ui,'Noto Sans SC',sans-serif;
  background:#101013; color:#E8E8EA;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
svg{display:block;}

/* ================= STUDIO (explorer chrome) ================= */
.stage-head{
  display:flex; align-items:center; gap:14px;
  padding:18px 28px; border-bottom:1px solid rgba(255,255,255,.07);
}
.stage-head .brand{display:flex; align-items:center; gap:11px;}
.stage-head .brand .ic{width:26px;height:26px;color:#EDEDEF;}
.stage-head .brand b{font-size:13px; letter-spacing:.22em; font-weight:700;}
.stage-head .brand span{font-size:10px; letter-spacing:.28em; color:#8A8A92; font-weight:500;}
.stage-head .hint{margin-left:auto; font-size:10px; letter-spacing:.14em; color:#6E6E76; text-transform:uppercase;}
.layout{display:flex; min-height:calc(100vh - 63px);}
.rail{
  width:236px; flex:0 0 236px; border-right:1px solid rgba(255,255,255,.07);
  padding:24px 20px; display:flex; flex-direction:column; gap:26px;
}
.rail h4{font-size:9.5px; letter-spacing:.24em; color:#77777F; font-weight:600; margin-bottom:10px; text-transform:uppercase;}
.seg{display:flex; flex-direction:column; gap:6px;}
.seg button{
  all:unset; cursor:pointer; font:inherit; color:#B9B9C0; font-size:11.5px; font-weight:500;
  padding:9px 13px; border-radius:10px; letter-spacing:.03em;
  display:flex; align-items:center; gap:10px; transition:background .18s,color .18s;
}
.seg button svg{width:15px;height:15px;opacity:.75;}
.seg button:hover{background:rgba(255,255,255,.06); color:#fff;}
.seg button.on{background:#EDEDEF; color:#101013;}
.seg button.on svg{opacity:1;}
.seg.row{flex-direction:row;}
.seg.row button{flex:1; justify-content:center; padding:9px 6px;}
.stage{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:34px 20px 40px; position:relative; gap:22px;
  background:
    radial-gradient(900px 520px at 24% -6%, rgba(255,255,255,.05), transparent 60%),
    radial-gradient(760px 520px at 86% 108%, rgba(255,255,255,.045), transparent 62%);
}
.spec-line{font-size:10.5px; letter-spacing:.2em; color:#77777F; text-transform:uppercase; font-weight:500; text-align:center; line-height:2;}
.spec-line b{color:#D9D9DE; font-weight:600;}
/* gallery */
.gallery{display:grid; grid-template-columns:repeat(3,auto); gap:44px 56px; align-items:start; justify-content:center;}
.gcell{display:flex; flex-direction:column; gap:14px; align-items:center;}
.gcell .glabel{font-size:10px; letter-spacing:.22em; color:#8A8A92; text-transform:uppercase; font-weight:600; text-align:center; line-height:1.9;}

/* ================= PHONE FRAME ================= */
.pw{position:relative; flex:0 0 auto;}
.pw.s82{width:338px;height:758px;}          /* 0.82 scale wrapper  */
.pw.s34{width:140px;height:314px;}          /* 0.34 mini           */
.pw .bezel{
  position:absolute; inset:0; border-radius:56px;
  background:linear-gradient(160deg,#232327,#0E0E10 55%);
  box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 0 0 1.5px rgba(255,255,255,.09);
}
.pw .btn-r{position:absolute; right:-2.5px; top:190px; width:2.5px; height:64px; border-radius:2px; background:#2C2C31;}
.pw .btn-v{position:absolute; left:-2.5px; top:170px; width:2.5px; height:38px; border-radius:2px; background:#2C2C31;}
.pw .btn-v2{position:absolute; left:-2.5px; top:222px; width:2.5px; height:38px; border-radius:2px; background:#2C2C31;}
.phone{
  width:412px; height:924px; transform-origin:top left; position:relative;
  border-radius:46px; overflow:hidden; isolation:isolate;
}
.s82 .phone{transform:scale(.82);}
.s34 .phone{transform:scale(.34);}
.s58 .phone{transform:scale(.58);}
.pw.s58{width:239px;height:536px;}
.phone.t-dark{background:var(--a-bg-dark); color:var(--a-text-dark);
  --bg:var(--a-bg-dark); --surface:var(--a-surface-dark);
  --tx:var(--a-text-dark); --tx2:var(--a-text2-dark); --tx3:var(--a-text3-dark);
  --line:var(--a-line-dark);
  --glass-bg:var(--a-glass-bg-dark); --glass-brd:var(--a-glass-brd-dark); --glass-hi:var(--a-glass-hi-dark);
  --glass-shadow:0 10px 36px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.46);
  --accent:#FFFFFF;
}
.phone.t-light{background:var(--a-bg-light); color:var(--a-text-light);
  --bg:var(--a-bg-light); --surface:var(--a-surface-light);
  --tx:var(--a-text-light); --tx2:var(--a-text2-light); --tx3:var(--a-text3-light);
  --line:var(--a-line-light);
  --glass-bg:var(--a-glass-bg-light); --glass-brd:var(--a-glass-brd-light); --glass-hi:var(--a-glass-hi-light);
  --glass-shadow:0 10px 30px rgba(10,10,15,.18);
  --scrim:rgba(12,12,16,.30);
  --accent:#0A0A0B;
}
.punch{position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:12px; height:12px; border-radius:50%; background:#000;
  box-shadow:inset 0 0 2px rgba(255,255,255,.22); z-index:60;}

/* ================= STATUS BAR ================= */
.statusbar{
  position:absolute; top:0; left:0; right:0; height:34px; z-index:55;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; font-size:11.5px; font-weight:600; letter-spacing:.02em;
  color:var(--tx); pointer-events:none;
}
.statusbar .sicons{display:flex; align-items:center; gap:6px;}
.statusbar svg{width:14px; height:14px;}

/* ================= HOME SCREEN ================= */
.s-home{position:absolute; inset:0;}
.wall{position:absolute; inset:0;
  background:
    radial-gradient(420px 300px at 18% 12%, rgba(255,255,255,.075), transparent 65%),
    radial-gradient(520px 380px at 86% 34%, rgba(255,255,255,.05), transparent 60%),
    radial-gradient(640px 480px at 50% 108%, rgba(255,255,255,.045), transparent 62%),
    linear-gradient(178deg,#131316 0%, #0A0A0B 46%, #060607 100%);
}
.t-light .wall{
  background:
    radial-gradient(420px 300px at 18% 12%, rgba(255,255,255,.85), transparent 62%),
    radial-gradient(520px 380px at 86% 34%, rgba(0,0,0,.035), transparent 60%),
    radial-gradient(640px 480px at 50% 108%, rgba(0,0,0,.05), transparent 62%),
    linear-gradient(178deg,#FBFBFC 0%, #F1F1F3 52%, #E7E7EA 100%);
}
.wall .glyph{position:absolute; right:-46px; bottom:118px; width:300px; height:300px; opacity:.05; color:var(--tx);}
.t-light .wall .glyph{opacity:.045;}
.clock{position:absolute; top:118px; left:34px; right:34px;}
.clock .t{font-size:82px; font-weight:300; letter-spacing:-.015em; line-height:1; color:var(--tx);}
.clock .d{margin-top:12px; font-size:14px; font-weight:500; letter-spacing:.06em; color:var(--tx2); text-transform:uppercase;}
.clock .tag{margin-top:26px; display:inline-flex; align-items:center; gap:9px;
  padding:9px 15px; border-radius:999px; background:var(--glass-bg);
  -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-brd); box-shadow:var(--glass-shadow);
  font-size:10.5px; font-weight:600; letter-spacing:.1em; color:var(--tx2); text-transform:uppercase;}
.clock .tag svg{width:13px; height:13px; color:var(--tx);}
.tiles{position:absolute; left:30px; right:30px; top:388px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.tile{border-radius:22px; padding:18px 8px 14px; text-align:center;
  background:var(--glass-bg); -webkit-backdrop-filter:blur(24px) saturate(1.5); backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--glass-brd); box-shadow:var(--glass-shadow);}
.tile .ic{width:30px; height:30px; margin:0 auto 9px; color:var(--tx);}
.tile .ic svg{width:30px;height:30px;}
.tile span{display:block; font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--tx2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tilename{position:absolute; left:30px; right:30px; top:352px; display:flex; justify-content:space-between;
  font-size:10px; letter-spacing:.22em; color:var(--tx3); text-transform:uppercase; font-weight:600; padding:0 4px;}

/* ================= ARTICLE PAGE (browse) ================= */
.s-page{position:absolute; inset:0; background:var(--bg); overflow:hidden;}
.t-dark .s-page{background:linear-gradient(180deg,#101013,#0A0A0B 30%);}
.art{position:absolute; inset:0; padding:56px 30px 120px; overflow:hidden;}
.art .site{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
.art .site .ic{width:17px; height:17px; color:var(--tx);}
.art .site b{font-size:10.5px; letter-spacing:.3em; font-weight:700; color:var(--tx);}
.art .site span{font-size:10px; color:var(--tx3); letter-spacing:.06em;}
.art h1{font-size:27px; line-height:1.28; font-weight:700; letter-spacing:-.01em; color:var(--tx);}
.art .byline{margin:14px 0 20px; font-size:11px; color:var(--tx3); font-weight:500; letter-spacing:.04em;}
.art .hero{height:150px; border-radius:18px; margin-bottom:22px; position:relative; overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%),var(--surface);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
.t-light .art .hero{background:linear-gradient(135deg,#E9E9EC,#F7F7F8 60%); border:1px solid var(--a-line-light);}
.art .hero svg{width:56px; height:56px; opacity:.16; color:var(--tx);}
.art p{font-size:13px; line-height:1.72; color:var(--tx2); margin-bottom:14px; font-weight:400;}
.art p b{color:var(--tx); font-weight:600;}
.art .quote{margin:18px 0; padding:4px 0 4px 16px; border-left:2px solid var(--tx);
  font-size:14.5px; line-height:1.6; color:var(--tx); font-weight:500;}
.art .tags{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
.art .tags i{font-style:normal; font-size:9.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--tx2); padding:6px 11px; border-radius:999px; border:1px solid var(--line);}

/* ================= LIQUID GLASS DOCK ================= */
.dock{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  width:260px; height:52px; border-radius:26px; z-index:70;
  display:flex; align-items:center; gap:4px; padding:0 4px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(28px) saturate(1.6) brightness(1.06);
  backdrop-filter:blur(28px) saturate(1.6) brightness(1.06);
  border:1px solid var(--glass-brd);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  transition:transform .36s cubic-bezier(.32,.72,0,1), opacity .3s ease, width .36s cubic-bezier(.32,.72,0,1);
}
.dock .url{
  flex:1; height:40px; border-radius:20px; display:flex; align-items:center; gap:7px; padding:0 11px;
  background:rgba(255,255,255,.07); border:1px solid transparent; min-width:0;
}
.t-light .dock .url{background:rgba(10,10,12,.055);}
.dock .url svg{width:14px; height:14px; color:var(--tx); flex:0 0 auto;}
.dock .url span{font-size:11.5px; font-weight:500; color:var(--tx2); letter-spacing:.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dock .url span b{color:var(--tx); font-weight:600;}
.dock .fbtn{width:44px; height:44px; border-radius:50%; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:var(--tx); position:relative;}
.dock .fbtn svg{width:21px; height:21px;}
.dock .fbtn:after{content:''; position:absolute; inset:-3px; border-radius:50%; background:rgba(255,255,255,.06); opacity:0; transition:opacity .2s;}
.t-light .dock .fbtn:after{background:rgba(10,10,12,.05);}
.phone[data-dock="sliver"] .dock{transform:translateX(-50%) translate(-96px,140px) scale(.55); opacity:0; pointer-events:none;}
.phone[data-dock="hidden"] .dock{opacity:0; pointer-events:none; transform:translateX(-50%) translateY(90px);}
.phone[data-dock="mid"] .dock{transform:translateX(-50%) translate(-90px,26px) scale(.72); opacity:.55;}
.phone[data-dock="mid"] .sliver{opacity:.5; width:3px;}
/* Edge sliver (collapsed dock) */
.sliver{
  position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:5px; height:120px; z-index:70; border-radius:0 4px 4px 0;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(28px) saturate(1.6); backdrop-filter:blur(28px) saturate(1.6);
  border-top:1px solid var(--glass-brd); border-right:1px solid var(--glass-brd); border-bottom:1px solid var(--glass-brd);
  box-shadow:4px 0 18px rgba(0,0,0,.28), inset 1px 0 0 var(--glass-hi);
  transition:opacity .24s ease .1s, width .2s ease;
}
.t-light .sliver{box-shadow:4px 0 16px rgba(10,10,15,.10), inset 1px 0 0 var(--glass-hi);}
.phone[data-dock="expanded"] .sliver,
.phone[data-dock="hidden"] .sliver{opacity:0; pointer-events:none; transition-delay:0s;}
.phone[data-dock="sliver"] .sliver{opacity:1;}

/* ================= SCRIM + SHEETS ================= */
.scrim{position:absolute; inset:0; background:var(--scrim); z-index:64;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:72;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(34px) saturate(1.6) brightness(1.05);
  backdrop-filter:blur(34px) saturate(1.6) brightness(1.05);
  border:1px solid var(--glass-brd); border-bottom:none;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  border-radius:26px 26px 0 0; padding:10px 18px 26px;}
.sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--tx3); opacity:.55; margin:4px auto 16px;}
/* Tabs sheet */
.sheet-tabs{top:64px; bottom:0; border-radius:26px 26px 0 0; display:flex; flex-direction:column;}
.sheet-tabs .th{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.sheet-tabs .th b{font-size:16px; font-weight:700; color:var(--tx); letter-spacing:.01em;}
.segpills{display:flex; gap:6px;}
.segpills i{font-style:normal; font-size:10px; font-weight:600; letter-spacing:.05em; padding:7px 12px; border-radius:999px; color:var(--tx2); border:1px solid var(--line);}
.segpills i.on{background:var(--tx); color:var(--bg); border-color:transparent;}
.tabgrid{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start; overflow:hidden;}
.tcard{border-radius:16px; overflow:hidden; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; height:172px;}
.tcard .cap{display:flex; align-items:center; gap:6px; padding:8px 10px;}
.tcard .cap svg{width:12px; height:12px; color:var(--tx2); flex:0 0 auto;}
.tcard .cap span{font-size:10px; font-weight:600; color:var(--tx2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tcard .thumb{flex:1; margin:0 8px 8px; border-radius:10px; background:var(--glass-bg); border:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:6px;}
.tcard .thumb i{display:block; height:6px; border-radius:3px; background:var(--line);}
.tcard .thumb i:nth-child(1){width:46%; height:8px; background:var(--tx3); opacity:.5;}
.tcard .thumb i:nth-child(2){width:88%;}
.tcard .thumb i:nth-child(3){width:76%;}
.tcard .thumb i:nth-child(4){width:82%;}
.tcard .thumb i:nth-child(5){width:34%;}
.tcard.priv{background:#0B0B0C; border-color:rgba(255,255,255,.16); color:#F4F4F5;}
.tcard.priv .cap span{color:#C9C9CF;}
.tcard.priv .thumb{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.12);}
.tcard.priv .thumb i{background:rgba(255,255,255,.16);}
.tcard.priv .thumb i:nth-child(1){background:rgba(255,255,255,.5);}
.tabbar{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
.tabbar .cnt{font-size:10.5px; font-weight:600; letter-spacing:.08em; color:var(--tx2); text-transform:uppercase;}
.tabbar .new{display:flex; align-items:center; gap:8px; padding:11px 20px; border-radius:999px;
  background:var(--tx); color:var(--bg); font-size:12px; font-weight:700; letter-spacing:.02em;}
.tabbar .new svg{width:15px; height:15px;}
.tabbar .more{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--tx); border:1px solid var(--line);}
.tabbar .more svg{width:19px; height:19px;}
/* Menu sheet */
.sheet-menu{padding-bottom:24px;}
.mhead{display:flex; align-items:center; gap:11px; padding:2px 4px 14px;}
.mhead .fav{width:34px; height:34px; border-radius:11px; background:var(--surface); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--tx);}
.mhead .fav svg{width:17px; height:17px;}
.mhead .dom{flex:1; min-width:0;}
.mhead .dom b{display:block; font-size:13px; font-weight:600; color:var(--tx);}
.mhead .dom span{font-size:10.5px; color:var(--tx3); font-weight:500;}
.mhead .shield{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
  background:var(--tx); color:var(--bg); font-size:10px; font-weight:700; letter-spacing:.04em;}
.mhead .shield svg{width:12px; height:12px;}
.mgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.mitem{display:flex; flex-direction:column; align-items:center; gap:8px; padding:13px 4px 11px; border-radius:14px;}
.mitem svg{width:21px; height:21px; color:var(--tx);}
.mitem span{font-size:9px; font-weight:600; letter-spacing:.03em; color:var(--tx2); text-align:center;}
/* Search sheet */
.sheet-search{padding-bottom:22px;}
.sinput{display:flex; align-items:center; gap:11px; padding:14px 16px; border-radius:18px;
  background:rgba(255,255,255,.08); border:1.5px solid var(--tx); margin-bottom:14px;}
.t-light .sinput{background:rgba(10,10,12,.05);}
.sinput svg{width:17px; height:17px; color:var(--tx);}
.sinput .q{font-size:15px; font-weight:500; color:var(--tx);}
.sinput .caret{width:1.5px; height:19px; background:var(--tx); animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.sinput .clr{margin-left:auto; width:20px; height:20px; border-radius:50%; background:var(--tx3); opacity:.5;
  display:flex; align-items:center; justify-content:center;}
.sinput .clr svg{width:11px; height:11px; color:var(--bg);}
.engrow{display:flex; gap:7px; margin-bottom:16px;}
.engrow i{font-style:normal; display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600;
  padding:7px 12px; border-radius:999px; border:1px solid var(--line); color:var(--tx2);}
.engrow i svg{width:12px; height:12px;}
.engrow i.on{background:var(--tx); color:var(--bg); border-color:transparent;}
.sugg{display:flex; flex-direction:column;}
.srow{display:flex; align-items:center; gap:13px; padding:11.5px 4px; border-bottom:1px solid var(--line);}
.srow:last-child{border-bottom:none;}
.srow svg{width:15px; height:15px; color:var(--tx3); flex:0 0 auto;}
.srow span{font-size:13px; color:var(--tx2); font-weight:400;}
.srow span b{color:var(--tx); font-weight:600;}
.srow .k{margin-left:auto; font-size:9px; letter-spacing:.14em; color:var(--tx3); text-transform:uppercase; font-weight:600;}

/* ================= PLATE MODE ================= */
body.plate{background:var(--plate-bg,#101013);}
body.plate.dark-plate{--plate-bg:#0C0C0E;}
body.plate.light-plate{--plate-bg:#F0F0F1;}
body.plate.diagram{--plate-bg:#FFFFFF;}
.plate-canvas{width:1240px; padding:54px 58px 50px; box-sizing:border-box; position:relative;}
body.plate.dark-plate .plate-canvas{color:#EDEDEF;}
body.plate.light-plate .plate-canvas, body.plate.diagram .plate-canvas{color:var(--ink);}
.plate-head{display:flex; align-items:baseline; gap:18px; margin-bottom:8px;}
.plate-kicker{font-size:10px; letter-spacing:.34em; font-weight:700; text-transform:uppercase; color:var(--ink2);}
body.plate.dark-plate .plate-kicker{color:#8E96A4;}
.plate-title{font-size:24px; font-weight:800; letter-spacing:-.01em;}
.plate-sub{margin-left:auto; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:var(--muted);}
.plate-rule{height:1px; background:var(--hairline); opacity:.6; margin:16px 0 0;}
body.plate.dark-plate .plate-rule{background:rgba(255,255,255,.14);}
.plate-row{display:flex; gap:38px; justify-content:center; margin-top:30px;}
.pcell{width:338px; display:flex; flex-direction:column; gap:0;}
.pcell .cap{margin-top:18px; text-align:center;}
.pcell .cap b{display:block; font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:700;}
.pcell .cap span{display:block; margin-top:6px; font-size:10.5px; line-height:1.65; font-weight:400;}
body.plate.dark-plate .pcell .cap b{color:#F0F0F2;}
body.plate.dark-plate .pcell .cap span{color:#96969E;}
body.plate.light-plate .pcell .cap b{color:var(--ink);}
body.plate.light-plate .pcell .cap span{color:var(--muted);}
.plate-foot{margin-top:34px; padding-top:16px; border-top:1px solid var(--hairline); opacity:.6;
  display:flex; justify-content:space-between; font-size:9px; letter-spacing:.26em; text-transform:uppercase; font-weight:600; color:var(--muted);}
body.plate.dark-plate .plate-foot{border-top-color:rgba(255,255,255,.12);}
body.plate.diagram, body.plate.diagram .plate-canvas{color:var(--ink);}
/* freeze animations for capture */
body.plate *{animation:none !important; transition:none !important;}
body.plate .sinput .caret{opacity:1;}

/* ---------- diagram plates (5 / 6) ---------- */
.diag-wrap{display:flex; gap:34px; margin-top:30px; align-items:stretch;}
.diag-card{border:1px solid var(--hairline); border-radius:18px; padding:26px; position:relative; background:#FCFCFD;}
.diag-card h5{font-size:10px; letter-spacing:.26em; text-transform:uppercase; font-weight:700; color:var(--ink2); margin-bottom:6px;}
.diag-card .dsub{font-size:10px; color:var(--muted); margin-bottom:20px; line-height:1.6;}
.zoomdock{transform:scale(1.8); transform-origin:left top;}
.dim{position:absolute; display:flex; align-items:center; font-size:9px; font-weight:600; letter-spacing:.08em; color:var(--ink2);}
.dim .ln{position:relative; flex:1; height:1px; background:var(--ink2);}
.dim .ln:before,.dim .ln:after{content:''; position:absolute; top:-3.5px; width:1px; height:8px; background:var(--ink2);}
.dim .ln:before{left:0;} .dim .ln:after{right:0;}
.dim span{padding:0 8px; white-space:nowrap;}
.dim.v{flex-direction:column;}
.dim.v .ln{width:1px; height:auto; flex:1;}
.dim.v .ln:before,.dim.v .ln:after{top:auto; left:-3.5px; width:8px; height:1px;}
.dim.v .ln:before{top:0;} .dim.v .ln:after{bottom:0;}
.dim.v span{padding:8px 0;}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.chip{font-size:9.5px; font-weight:600; letter-spacing:.05em; padding:7px 11px; border-radius:8px;
  border:1px solid var(--hairline); background:var(--card); color:var(--ink2);}
.chip b{color:var(--ink); font-weight:700;}
.glass-stack{display:flex; flex-direction:column-reverse; gap:5px; margin-top:18px;}
.glass-stack div{border-radius:8px; padding:9px 12px; font-size:9.5px; font-weight:600; letter-spacing:.04em;
  border:1px solid var(--hairline); color:var(--ink2); background:var(--card);}
.glass-stack div.hl{background:var(--ink); color:#fff; border-color:var(--ink);}
.sliverbox{position:relative; height:420px; display:flex; justify-content:center;}
.motion-strip{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:26px;}
.mcell{display:flex; flex-direction:column; gap:10px; align-items:center; width:158px;}
.mcell .mlabel{font-size:9px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--ink2); text-align:center; line-height:1.7;}
.marrow{display:flex; flex-direction:column; align-items:center; gap:5px; width:96px;}
.marrow svg{width:100%; height:12px; color:var(--ink2);}
.marrow span{font-size:8.5px; font-weight:700; letter-spacing:.06em; color:var(--ink2); background:var(--card); border:1px solid var(--hairline); padding:4px 8px; border-radius:6px; white-space:nowrap;}
.curve-card{flex:1;}
.curve-card svg{width:100%; height:auto; margin-top:10px;}
.ttable{width:100%; border-collapse:collapse; margin-top:16px; font-size:10.5px;}
.ttable th{font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink2); text-align:left; padding:8px 10px; border-bottom:1.5px solid var(--ink2); font-weight:700;}
.ttable td{padding:8px 10px; border-bottom:1px solid var(--hairline); color:var(--ink); font-weight:500;}
.ttable td.mut{color:var(--muted); font-weight:400;}
</style>
</head>
<body class="mode-explorer">
<div id="app"></div>
<script>
'use strict';
/* ================= ICONS (1.7 stroke, monochrome) ================= */
const I = (p, s = 24) => `<svg viewBox="0 0 ${s} ${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  shield: I('<path d="M12 2.6l7.4 2.9v5.3c0 4.6-3.1 7.9-7.4 9.8-4.3-1.9-7.4-5.2-7.4-9.8V5.5L12 2.6z"/><path d="M9.4 15.4L12 8.6l2.6 6.8"/><path d="M10.3 13.2h3.4"/>'),
  lock: I('<rect x="7" y="10.6" width="10" height="9" rx="2.2"/><path d="M9.2 10.6V8.2a2.8 2.8 0 015.6 0v2.4"/>'),

  down: I('<path d="M12 4.5v10M7.8 10.6L12 14.8l4.2-4.2"/><path d="M5.5 17.5h13"/>'),
  monitor: I('<rect x="4" y="5.5" width="16" height="10.5" rx="1.8"/><path d="M9.5 19.5h5M12 16v3.5"/>'),
  gear: I('<circle cx="12" cy="12" r="3.1"/><path d="M12 3.4v2.4M12 18.2v2.4M3.4 12h2.4M18.2 12h2.4M5.9 5.9l1.7 1.7M16.4 16.4l1.7 1.7M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7"/>'),
  incog: I('<path d="M4 4l16 16"/><path d="M9.9 5.3A9.4 9.4 0 0121 12a17 17 0 01-2.4 3.1M6.9 6.9A16.6 16.6 0 003 12a9.6 9.6 0 0012.9 4.9"/><path d="M9.6 9.6a3.1 3.1 0 004.5 4.5"/>'),
  x: I('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'),
  globe: I('<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.3 3.6 5 3.6 8s-1.1 5.7-3.6 8c-2.5-2.3-3.6-5-3.6-8s1.1-5.7 3.6-8z"/>'),

  wifi: I('<path d="M4 9.6a12.6 12.6 0 0116 0M6.8 12.8a8.6 8.6 0 0110.4 0M9.6 16a4.4 4.4 0 014.8 0M12 19h.01"/>'),

  batt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="8" width="16" height="8" rx="2.4"/><rect x="5" y="10" width="9.5" height="4" rx="1.2" fill="currentColor" stroke="none"/><path d="M21 10.5v3" stroke-linecap="round"/></svg>`,
};

/* ================= FRAGMENTS ================= */
const statusbar = `<div class="statusbar"><span>9:41</span><span class="sicons">${IC.sig}${IC.wifi}${IC.batt}</span></div>`;
const dock = `<div class="dock">
  <div class="url">${IC.shield}<span><b>aegis</b>.dev</span></div>
  <div class="fbtn">${IC.plus}</div>
  <div class="fbtn">${IC.dots}</div>
</div>`;
const dockHome = `<div class="dock">
  <div class="url">${IC.search}<span>Search or type URL</span></div>
  <div class="fbtn">${IC.plus}</div>
  <div class="fbtn">${IC.dots}</div>
</div>`;
const sliver = `<div class="sliver"></div>`;
const dockStatic = dock.replace('class="dock"', 'class="dock" style="position:relative;left:auto;bottom:auto;transform:none;"');
const home = `<div class="s-home"><div class="wall"><div class="glyph">${IC.shield}</div></div>
  <div class="clock"><div class="t">9:41</div><div class="d">Mon, November 3</div>
    <div class="tag">${IC.shield} Hardened · 92,957 hosts blocked</div></div>
  <div class="tilename"><span>Quick shields</span><span>Aegis</span></div>
  <div class="tiles">
    <div class="tile"><div class="ic">${IC.shield}</div><span>aegis.dev</span></div>
    <div class="tile"><div class="ic">${IC.globe}</div><span>wikipedia</span></div>
    <div class="tile"><div class="ic">${IC.code}</div><span>github</span></div>
    <div class="tile"><div class="ic">${IC.search}</div><span>duckduckgo</span></div>
    <div class="tile"><div class="ic">${IC.sync}</div><span>sync</span></div>
    <div class="tile"><div class="ic">${IC.incog}</div><span>private</span></div>
  </div></div>`;
const article = `<div class="s-page"><div class="art">
  <div class="site">${IC.shield}<b>AEGIS JOURNAL</b><span>/ engineering</span></div>
  <h1>Hardened by default: how Aegis silences 92,957 hostile hosts</h1>
  <div class="byline">Aegis Team &nbsp;·&nbsp; Nov 2026 &nbsp;·&nbsp; 6 min read</div>
  <div class="hero">${IC.shield}</div>
  <p>The web was not designed to watch you, but it learned to. Aegis starts from a different premise: <b>the page is the product, the browser is the shield</b>. Every network request is checked against a live blocklist of 92,957 ad and tracker hosts — before a single byte is downloaded.</p>
  <p>There is no extension to install and no settings tour to survive. Third-party cookies are dead on arrival, sync is sealed with <b>AES-256-GCM</b>, and the interface stays out of the way. What remains is the page, edge to edge, at full screen.</p>
  <div class="quote">"Private by default is not a feature. It is the floor."</div>
  <p>This is why the chrome around the page is designed to disappear: a liquid-glass dock, a five-pixel sliver, and nothing else.</p>
  <div class="tags"><i>Privacy</i><i>Chromium</i><i>Design</i></div>
</div></div>`;
const tabsSheet = `<div class="sheet sheet-tabs">
  <div class="th"><b>Tabs</b><div class="segpills"><i class="on">Regular · 5</i><i>Private · 2</i></div></div>
  <div class="tabgrid">
    <div class="tcard"><div class="cap">${IC.shield}<span>aegis.dev</span></div><div class="thumb"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="tcard"><div class="cap">${IC.globe}<span>Hardened by default — Aegis Journal</span></div><div class="thumb"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="tcard"><div class="cap">${IC.globe}<span>Wikipedia</span></div><div class="thumb"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="tcard"><div class="cap">${IC.code}<span>github.com/aegis</span></div><div class="thumb"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="tcard priv"><div class="cap">${IC.incog}<span>Private · 2 tabs</span></div><div class="thumb"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="tabbar"><span class="cnt">5 tabs</span><div class="new">${IC.plus} New tab</div><div class="more">${IC.dots}</div></div>
</div>`;
const menuSheet = `<div class="scrim"></div><div class="sheet sheet-menu">
  <div class="grab"></div>
  <div class="mhead">
    <div class="fav">${IC.shield}</div>
    <div class="dom"><b>aegis.dev</b><span>aegis.dev/journal/hardened-by-default</span></div>
    <div class="shield">${IC.shield} 14 blocked</div>
  </div>
  <div class="mgrid">
    <div class="mitem">${IC.plus}<span>New tab</span></div>
    <div class="mitem">${IC.incog}<span>Private tab</span></div>
    <div class="mitem">${IC.clock}<span>History</span></div>
    <div class="mitem">${IC.down}<span>Downloads</span></div>
    <div class="mitem">${IC.star}<span>Bookmarks</span></div>
    <div class="mitem">${IC.search}<span>Find in page</span></div>
    <div class="mitem">${IC.monitor}<span>Desktop site</span></div>
    <div class="mitem">${IC.gear}<span>Settings</span></div>
  </div>
</div>`;
const searchSheet = `<div class="scrim"></div><div class="sheet sheet-search">
  <div class="grab"></div>
  <div class="sinput">${IC.search}<span class="q">aegis</span><span class="caret"></span><span class="clr">${IC.x}</span></div>
  <div class="engrow"><i class="on">${IC.shield} Aegis</i><i>DuckDuckGo</i><i>Startpage</i><i>${IC.globe} Wikipedia</i></div>
  <div class="sugg">
    <div class="srow">${IC.search}<span><b>aegis</b> browser</span><span class="k">Aegis</span></div>
    <div class="srow">${IC.clock}<span><b>aegis</b> browser private mode</span><span class="k">History</span></div>
    <div class="srow">${IC.globe}<span>aegis-browser.pages.dev</span><span class="k">Site</span></div>
    <div class="srow">${IC.star}<span><b>aegis</b> sync — AES-256-GCM</span><span class="k">Saved</span></div>
  </div>
</div>`;

/* ================= PHONE BUILDER ================= */
function phoneHTML(o) {
  const screen = o.screen === 'home' ? home : article;
  let overlays = '';
  if (o.screen === 'tabs') overlays = tabsSheet;
  if (o.screen === 'menu') overlays = menuSheet;
  if (o.screen === 'search') overlays = searchSheet;
  const dockState = (o.screen === 'home' || o.screen === 'browse') ? (o.dock || 'expanded') : 'hidden';
  const d = dockState === 'sliver' || dockState === 'hidden' ? dockHome : (o.screen === 'home' ? dockHome : dock);
  return `<div class="phone t-${o.theme}" data-dock="${dockState}">
    ${screen}
    ${o.screen === 'menu' || o.screen === 'search' ? '' : ''}
    ${(o.screen === 'menu' || o.screen === 'search') ? '' : ''}
    ${overlays.includes('scrim') ? '' : ''}
    ${statusbar}
    ${overlays}
    ${o.screen === 'home' || o.screen === 'browse' ? d : ''}
    ${o.screen === 'home' || o.screen === 'browse' ? sliver : ''}
    <div class="punch"></div>
  </div>`;
}
const pw = (o, s) => `<div class="pw ${s}"><div class="bezel"></div><div class="btn-r"></div><div class="btn-v"></div><div class="btn-v2"></div>${phoneHTML(o)}</div>`;

/* ================= EXPLORER ================= */
const SCREENS = [['home', 'New-tab home', IC.grid], ['browse', 'Browsing', IC.globe], ['tabs', 'Tab grid', IC.grid], ['menu', '3-dot menu', IC.dots], ['search', 'Search overlay', IC.search]];
const state = { screen: 'browse', theme: 'dark', dock: 'expanded', gallery: false };
function renderExplorer() {
  const app = document.getElementById('app');
  const btn = (id, label, icon, on) => `<button data-k="${id}" class="${on ? 'on' : ''}">${icon}${label}</button>`;
  const rail = `<div class="rail">
    <div><h4>Screen</h4><div class="seg">${SCREENS.map(s => btn('screen:' + s[0], s[1], s[2], state.screen === s[0] && !state.gallery)).join('')}</div></div>
    <div><h4>Theme</h4><div class="seg row">${btn('theme:dark', 'Dark', '', state.theme === 'dark')}${btn('theme:light', 'Light', '', state.theme === 'light')}</div></div>
    <div><h4>Dock state</h4><div class="seg">${btn('dock:expanded', 'Expanded', '', state.dock === 'expanded')}${btn('dock:sliver', 'Collapsed — edge sliver', '', state.dock === 'sliver')}${btn('dock:hidden', 'Fully hidden', '', state.dock === 'hidden')}</div></div>

  </div>`;
  const spec = `412 × 924 DP &nbsp;·&nbsp; <b>${state.theme.toUpperCase()}</b> &nbsp;·&nbsp; <b>${state.gallery ? 'GALLERY' : (SCREENS.find(s => s[0] === state.screen)[1] + ' · DOCK ' + state.dock.toUpperCase())}</b>`;
  let stageInner;
  if (state.gallery) {
    const cells = [
      ['New-tab home', { screen: 'home', dock: 'expanded' }],
      ['Browsing · dock', { screen: 'browse', dock: 'expanded' }],
      ['Browsing · sliver', { screen: 'browse', dock: 'sliver' }],
      ['Tab grid', { screen: 'tabs' }],
      ['3-dot menu', { screen: 'menu' }],
      ['Search overlay', { screen: 'search' }],
    ];
    stageInner = `<div class="gallery">${cells.map(c => `<div class="gcell">${pw({ ...c[1], theme: state.theme }, 's58')}<div class="glabel">${c[0]}</div></div>`).join('')}</div>`;
  } else {
    stageInner = pw({ screen: state.screen, theme: state.theme, dock: state.dock }, 's82');
  }
  app.innerHTML = `
    <div class="stage-head">
      <div class="brand"><div class="ic">${IC.shield}</div><div><b>AEGIS BROWSER</b><br><span>LIQUID GLASS DOCK · UI CONCEPT</span></div></div>
      <div class="hint">Zero chrome · full-screen pages · glass dock</div>
    </div>
    <div class="layout">${rail}<div class="stage">${stageInner}<div class="spec-line">${spec}</div></div></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const [k, v] = b.dataset.k.split(':');
  if (k === 'screen') { state.screen = v; state.gallery = false; }
  if (k === 'theme') state.theme = v;
  if (k === 'dock') { state.dock = v; state.gallery = false; state.screen = state.screen === 'home' ? 'home' : 'browse'; }
  if (k === 'gallery') state.gallery = !state.gallery;
  renderExplorer();
});

/* ================= PLATES ================= */
const PLATE_FOOT = `<div class="plate-foot"><span>Aegis Browser · Liquid Glass Dock — UI Design Proposal</span><span>Plate NF · November 2026</span></div>`;
const plateShell = (n, kicker, title, sub, inner, theme) => `<div class="plate-canvas">
  <div class="plate-head"><span class="plate-kicker">${kicker}</span><span class="plate-title">${title}</span><span class="plate-sub">${sub}</span></div>
  <div class="plate-rule"></div>${inner}${PLATE_FOOT.replace('Plate NF', 'Plate 0' + n)}</div>`;
function plateCore(theme) {
  const cells = [
    ['New-tab home', 'Clock, guarded-status pill and monochrome quick tiles. The dock floats 16 dp above the edge.', { screen: 'home', dock: 'expanded' }],

  ];
  const inner = `<div class="plate-row">${cells.map(c => `<div class="pcell">${pw({ ...c[2], theme }, 's82')}<div class="cap"><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('')}</div>`;
  return { inner, title: theme === 'dark' ? 'Core experience — dark' : 'Core experience — light' };
}
function plateOverlays(theme) {
  const cells = [
    ['Tab grid', 'Frosted sheet over the live page. Private tabs invert to true black; one tap switches, long-press closes.', { screen: 'tabs' }],
    ['3-dot menu', 'Page context with live tracker-shield count and eight monochrome quick actions in a 4 × 2 grid.', { screen: 'menu' }],
    ['Search overlay', 'Rises from the dock URL pill: privacy-first engines, history and site suggestions — all glass.', { screen: 'search' }],
  ];
  const inner = `<div class="plate-row">${cells.map(c => `<div class="pcell">${pw({ ...c[2], theme }, 's82')}<div class="cap"><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('')}</div>`;
  return { inner, title: theme === 'dark' ? 'Overlays — dark' : 'Overlays — light' };
}
function plateAnatomy() {
  const zoom = `<div style="position:relative;width:560px;height:238px;">
    <div class="zoomdock" style="margin:60px 0 0 40px;">${dockStatic}</div>
    <div class="dim" style="left:40px;top:206px;width:468px;"><i class="ln" style="flex:1"></i><span>260 dp</span><i class="ln" style="flex:1"></i></div>
    <div class="dim v" style="left:534px;top:60px;height:94px;"><i class="ln"></i><span>52 dp</span></div>
    <div class="dim" style="left:40px;top:26px;width:340px;"><i class="ln" style="flex:1"></i><span>pill radius 26 dp · bottom offset 16 dp</span><i class="ln" style="flex:1"></i></div>
  </div>`;
  const cardA = `<div class="diag-card" style="flex:1.55;">
    <h5>Dock — expanded geometry</h5><div class="dsub">260 × 52 dp pill · rendered at 1.8×</div>
    ${zoom}
    <div class="chips"><span class="chip">URL pill <b>148 dp</b></span><span class="chip">Buttons <b>44 dp</b> · 48 dp touch</span><span class="chip">Icon <b>21 dp</b> · 1.7 stroke</span><span class="chip">Gap <b>4 dp</b></span></div>
  </div>`;
  const stack = `<div class="glass-stack">
    <div class="hl">05 · Shadow — 0 10 36 dp · 45% (dark) / 14% (light)</div>
    <div>04 · Top highlight — inset 1 dp · 10% white / 55% white (light)</div>
    <div>03 · Border — 1 dp · 14% white (dark) / 10% ink (light)</div>
    <div>02 · Tint — 52% ink (dark) · 62% white (light)</div>
    <div>01 · Backdrop — blur 28 px · saturate 1.6</div>
    <div style="border-style:dashed;background:transparent;">00 · Live page content, edge to edge</div>
  </div>`;
  const cardB = `<div class="diag-card" style="flex:1;">
    <h5>Liquid glass — layer recipe</h5><div class="dsub">Five stacked treatments over the page itself. No opaque surfaces anywhere.</div>
    ${stack}
    <div class="chips"><span class="chip">Dark tint <b>rgba(16,16,18,.52)</b></span><span class="chip">Light tint <b>rgba(255,255,255,.62)</b></span></div>
  </div>`;
  const sliverCard = `<div class="diag-card" style="flex:1;">
    <h5>Edge sliver — collapsed dock</h5><div class="dsub">5 × 120 dp · flush left · vertically centered · shown at 3×</div>
    <div class="sliverbox">
      <div style="position:absolute;left:50%;top:30px;width:15px;height:360px;border-radius:0 6px 6px 0;background:linear-gradient(180deg,rgba(21,22,23,.28),rgba(21,22,23,.16));border:1px solid var(--hairline);border-left:none;"></div>
      <div style="position:absolute;left:calc(50% - 36px);top:20px;width:72px;height:380px;border:1.5px dashed var(--ink2);border-radius:8px;opacity:.55;"></div>
      <div class="dim v" style="left:calc(50% + 26px);top:30px;height:360px;"><i class="ln"></i><span>120 dp</span></div>
      <div class="dim v" style="left:calc(50% - 78px);top:20px;height:380px;"><i class="ln"></i><span>touch 24 × 140 dp</span></div>
      <div class="dim" style="left:calc(50% - 8px);top:408px;width:32px;"><i class="ln"></i><span>5 dp</span></div>
    </div>
    <div class="chips"><span class="chip">Idle <b>5 dp</b> wide</span><span class="chip">Touch <b>9 dp</b></span><span class="chip">Tap / swipe right <b>→ expand</b></span></div>
  </div>`;
  const stateRow = (iconHtml, label, note, extra) => `<div style="display:flex;align-items:center;gap:18px;margin-top:14px;">
    <div class="dock" style="position:static;transform:none;width:246px;">
      <div class="url">${iconHtml}<span>${label}</span></div>
      <div class="fbtn">${IC.plus}</div><div class="fbtn">${IC.dots}</div>
    </div>
    <div style="flex:1;"><div style="font-size:11px;font-weight:700;color:var(--ink);">${note}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;line-height:1.55;">${extra}</div></div>
  </div>`;
  const statesCard2 = `<div class="diag-card" style="flex:1.05;">
    <h5>URL pill — security states</h5><div class="dsub">The only chrome that ever speaks. It says one word: trust.</div>
    ${stateRow(IC.shield, '<b>aegis</b>.dev', 'Secured · shielded', 'TLS valid · 14 trackers blocked on this page before load.')}
    ${stateRow(IC.search, 'Search or type URL', 'Home / new tab', 'Empty state — the pill is the browser\'s entire start menu.')}
    ${stateRow(IC.lock, 'example.net', 'Loading · 62%', 'Thin 1.5 dp progress line hugs the pill\'s bottom radius.')}
  </div>`;
  return { inner: `<div class="diag-wrap">${cardA}${cardB}</div><div class="diag-wrap" style="margin-top:24px;">${sliverCard}${statesCard2}</div>`, title: 'Dock anatomy & glass recipe' };
}
function bez(t, x1, y1, x2, y2) {
  const W = 460, H = 210, pt = u => {
    const x = (1 - u) ** 3 * 0 + 3 * (1 - u) ** 2 * u * x1 + 3 * (1 - u) * u ** 2 * x2 + u ** 3 * 1;
    const y = (1 - u) ** 3 * 0 + 3 * (1 - u) ** 2 * u * y1 + 3 * (1 - u) * u ** 2 * y2 + u ** 3 * 1;
    return [x * W, H - y * H];
  };
  return [0.25, 0.5, 0.75].map(u => pt(u).map(v => v.toFixed(1)).join(','));
}
function plateMotion() {
  const dots = bez(0, 0.32, 0.72, 0, 1);
  const curve = `<div class="diag-card curve-card" style="flex:1.15;">
    <h5>Collapse curve — cubic-bezier(.32, .72, 0, 1)</h5><div class="dsub">Android "emphasized" family: fast departure, glass settles without bounce.</div>
    <svg viewBox="0 0 500 250" style="margin-top:8px;">
      <line x1="20" y1="220" x2="480" y2="220" stroke="#B2BFCC" stroke-width="1"/>
      <line x1="20" y1="220" x2="20" y2="16" stroke="#B2BFCC" stroke-width="1"/>
      <line x1="20" y1="220" x2="480" y2="16" stroke="#B2BFCC" stroke-width="1" stroke-dasharray="4 5" opacity=".55"/>
      <path d="M20,220 C${(20 + 0.32 * 460).toFixed(0)},${(220 - 0.72 * 204).toFixed(0)} ${(20 + 0 * 460).toFixed(0)},${(220 - 1 * 204).toFixed(0)} 480,16" fill="none" stroke="#151617" stroke-width="2.6" stroke-linecap="round"/>
      ${dots.map((d, i) => `<circle cx="${20 + (+d.split(',')[0])}" cy="${+d.split(',')[1]}" r="4.4" fill="#151617"/>`).join('')}
      <text x="470" y="240" font-size="10" fill="#80858A" text-anchor="end" font-family="Montserrat" letter-spacing="2">TIME →</text>
      <text x="12" y="120" font-size="10" fill="#80858A" font-family="Montserrat" letter-spacing="2" transform="rotate(-90 12 120)">POSITION</text>
    </svg>
  </div>`;
  const rows = [
    ['Collapse to sliver', '360 ms', 'cubic-bezier(.32, .72, 0, 1)'],
    ['Expand from sliver', '420 ms', 'cubic-bezier(.34, 1.28, .44, 1) — 4 dp overshoot'],
    ['Overlay sheet rise', '380 ms', 'cubic-bezier(.05, .7, .1, 1)'],
    ['Scrim fade', '240 ms', 'linear-out'],
    ['Theme cross-fade', '250 ms', 'ease'],
    ['URL pill focus morph', '300 ms', 'emphasized decelerate'],
  ];
  const table = `<div class="diag-card" style="flex:1;">
    <h5>Timing map</h5><div class="dsub">Every transition lands under half a second. Nothing blocks the page.</div>
    <table class="ttable"><tr><th>Transition</th><th>Duration</th><th>Curve</th></tr>
    ${rows.map(r => `<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="mut">${r[2]}</td></tr>`).join('')}</table>
  </div>`;
  const mini = (dockState, label) => `<div class="mcell"><div class="pw s34"><div class="bezel"></div>${phoneHTML({ screen: 'browse', theme: 'dark', dock: dockState })}</div><div class="mlabel">${label}</div></div>`;
  const arrow = (t) => `<div class="marrow"><svg viewBox="0 0 96 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M0 6h88m0 0l-6-4m6 4l-6 4"/></svg><span>${t}</span></div>`;
  const strip = `<div class="motion-strip">
    ${mini('expanded', 'Dock expanded<br>rest state')}
    ${arrow('360 ms')}
    ${mini('mid', 'Collapsing<br>toward left edge')}
    ${arrow('sliver in · 240 ms')}
    ${mini('sliver', 'Edge sliver<br>5 × 120 dp')}
    ${arrow('420 ms · spring')}
    ${mini('expanded', 'Recalled<br>full dock')}
  </div>`;
  const triggers = `<div class="diag-card" style="margin-top:24px;">
    <h5>Auto-hide triggers</h5><div class="dsub">The dock manages itself; hands stay on the page.</div>
    <div class="chips" style="margin-top:4px;">
      <span class="chip">Scroll down · idle <b>1.2 s</b> → collapse</span>
      <span class="chip">Navigation complete → <b>peek 2.4 s</b>, then collapse</span>
      <span class="chip">Tap sliver / swipe right → <b>expand</b></span>
      <span class="chip">Fling dock down or left → <b>collapse</b></span>
      <span class="chip">Focus a text field → <b>stay hidden</b></span>
      <span class="chip">Setting: <b>reading mode</b> default on</span>
    </div>
  </div>`;
  return { inner: strip + `<div class="diag-wrap" style="margin-top:26px;">${curve}${table}</div>${triggers}`, title: 'Motion & state transitions' };
}

/* ================= ROUTER ================= */
const q = new URLSearchParams(location.search);
const app = document.getElementById('app');
if (q.has('plate')) {
  const n = +q.get('plate');
  const theme = q.get('theme') || 'dark';
  let out, cls = 'plate ';
  if (n === 1) { out = plateCore('dark'); cls += 'dark-plate'; }
  if (n === 2) { out = plateCore('light'); cls += 'light-plate'; }
  if (n === 3) { out = plateOverlays('dark'); cls += 'dark-plate'; }
  if (n === 4) { out = plateOverlays('light'); cls += 'light-plate'; }
  if (n === 5) { out = plateAnatomy(); cls += 'diagram'; }
  if (n === 6) { out = plateMotion(); cls += 'diagram'; }
  const SUB = {1: 'Dark glass', 2: 'Light glass', 3: 'Dark glass', 4: 'Light glass', 5: 'Concept spec', 6: 'Concept spec'};
  document.body.className = cls;
  app.innerHTML = plateShell(n, 'Aegis Browser · Liquid Glass Dock', out.title, SUB[n] || 'Concept spec', out.inner, theme);
} else {
  document.body.className = 'mode-explorer';
  renderExplorer();
}
</script>
