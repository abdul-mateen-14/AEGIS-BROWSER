name: Deploy Aegis ID portal (Cloudflare Pages free tier)

# The central identity portal at https://aegis-id.pages.dev
# (Pages + Functions: create account, password/Google/passkey sign-in,
# profile, connections, danger zone).
#
# The portal SOURCE lives in the AEGIS-OS repo
# (services/aegis-id-portal/); this repo holds the Cloudflare
# credentials, so the deployment flow is:
#   checkout AEGIS-OS main -> apply aegis-id-portal.patch (branding +
#   theme-aware favicon wave) -> wrangler pages deploy.
#
# Requires the same two repository Secrets as deploy-landing.yml:
#   CLOUDFLARE_API_TOKEN (needs "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID
# The Pages project 'aegis-id' already exists (site is live).

on:
  push:
    branches: [main]
    paths:
      - 'aegis-id-portal.patch'
      - '.github/workflows/deploy-aegis-id.yml'
  workflow_dispatch:

concurrency:
  group: pages-aegis-id
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the portal source (AEGIS-OS repo)
        uses: actions/checkout@v4
        with:
          repository: abdul-mateen-14/AEGIS-OS
          ref: main
          path: aegis-os

      - name: Apply the portal branding patch
        run: |
          cd aegis-os
          git apply -p1 --verbose ../aegis-id-portal.patch

      - name: Resolve the project's production branch
        id: proj
        run: |
          PROD_BRANCH=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/aegis-id" \
            | jq -r '.result.production_branch')
          echo "production branch: $PROD_BRANCH"
          echo "branch=$PROD_BRANCH" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Stamp a unique marker into the bundle
        run: |
          echo "aegis-id deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) commit $(git -C aegis-os rev-parse --short HEAD) patch $(git rev-parse --short HEAD)" \
            > aegis-os/services/aegis-id-portal/public/deploy-marker.txt
          cat aegis-os/services/aegis-id-portal/public/deploy-marker.txt

      - name: Deploy services/aegis-id-portal to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: aegis-os/services/aegis-id-portal
          wranglerVersion: "4"
          # no positional: wrangler v4 reads pages_build_output_dir ("public")
          # from wrangler.toml - the earlier `pages deploy .` uploaded the
          # portal ROOT (wrangler.toml/schema/tests + public/ nested), which
          # 404s every route on the domain
          command: pages deploy --project-name=aegis-id --branch=${{ steps.proj.outputs.branch }} --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the production domain serves it
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" https://aegis-id.pages.dev/)
          echo "https://aegis-id.pages.dev/ -> HTTP $code"
          test "$code" = "200"
          n=$(curl -s https://aegis-id.pages.dev/ | grep -c favicon || true)
          echo "favicon references in live HTML: $n"
          s=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" https://aegis-id.pages.dev/style.css)
          echo "style.css -> $s"
          f=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" https://aegis-id.pages.dev/favicon-192.png)
          echo "favicon-192.png -> $f"
          m=$(curl -s https://aegis-id.pages.dev/deploy-marker.txt)
          echo "deploy-marker.txt -> $m"

      - name: Dump project identity (subdomain/domains/latest)
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/aegis-id" \
            | jq '{name: .result.name, subdomain: .result.subdomain, domains: .result.domains, prod_branch: .result.production_branch, latest_url: .result.latest_deployment.url, latest_env: .result.latest_deployment.environment, latest_modified: .result.latest_deployment.modified_on}'
          echo "---- try the latest deployment's own URL ----"
          LURL=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/aegis-id" \
            | jq -r '.result.latest_deployment.url')
          curl -s -o /dev/null -w "$LURL -> %{http_code} %{size_download}b\n" "$LURL"
          curl -s -o /dev/null -w "$LURL/deploy-marker.txt -> %{http_code}\n" "$LURL/deploy-marker.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Diagnose production alias (which deployment is live?)
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/aegis-id/deployments?per_page=5" \
            | jq -r '.result[] | "\(.id[0:8]) env=\(.environment) branch=\(.deployment_trigger.metadata.branch) prod=\(.production_url // "-") mod=\(.modified_on)"'
          echo "---- live check ----"
          curl -s "https://aegis-id.pages.dev/?cb=$RANDOM" | head -c 400
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
