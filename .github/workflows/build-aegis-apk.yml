name: Build Aegis Browser APK (free GitHub-hosted runner)

# Free-build pipeline for Aegis Browser (Android, arm64).
# Runs entirely on GitHub's free hosted runners for PUBLIC repositories.
#
# What it does:
#   1. Frees disk space and adds swap on the runner
#   2. Fetches Chromium source WITHOUT git history (saves ~20 GB)
#   3. Checks out a specific Chromium stable tag
#   4. Restores the banked build tree from the previous run (if any)
#   5. Applies your Aegis patches from aegis/patches/ (if any)
#   6. Builds chrome_public_apk for arm64 with low-RAM gn args (no LTO/PGO)
#   7. Signs it with YOUR release keystore (from repo Secrets)
#   8. Publishes the APK to a draft GitHub Release
#
# RESUMABILITY - build-tree banking (aegis/ci/bank.sh), NOT ccache:
# Chromium 156 compiles all C++ with C++20 modules (clang PCM) and ccache
# cannot cache module compilation units, so the old ccache design banked
# almost nothing (37 MB). Instead, when a run approaches the 6 h cap it
# stops ninja GRACEFULLY (SIGINT), streams out/<dir>/obj + gen +
# .ninja_log + .ninja_deps into zstd volumes and uploads them as assets of
# a DRAFT release (no actions/cache -> the 10 GB repo cache limit and its
# eviction policy never apply; only the 2 GiB per-file limit does, hence
# the split). The next run downloads, sha256-verifies and extracts the
# bank, normalizes mtimes (obj must be newer than gen and sources), and
# ninja continues incrementally. Every compile goes through the atomic
# cc wrapper (aegis/ci/atomic_cc.c) so a killed compiler never leaves a
# half-written object for ninja to trust. Patches are applied AFTER the
# mtime normalization, so any patched source is strictly newer than the
# banked objects and recompiles - invalidation by mtime ordering.
# Expect 3-4 runs for the first full build (~10% of each window is spent
# moving the bank), then fast incremental rebuilds. The watchdog cron
# re-dispatches automatically.

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: 'Chromium version tag (empty = latest Chrome stable, e.g. 156.0.8078.79)'
        required: false
        default: ''
      build_target:
        description: 'Ninja target'
        required: false
        default: 'chrome_public_apk'

concurrency:
  group: aegis-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04          # pinned: 'ubuntu-latest' is migrating to 26.04 during Oct-Nov 2026
    timeout-minutes: 350           # GitHub hard cap is 360 for hosted runners
    permissions:
      contents: write              # needed to create the draft release(s)
    env:
      # /mnt is root-owned on hosted runners (plain mkdir fails with
      # "Permission denied"), so keep the workspace under the runner's home.
      # Same physical disk (~145 GB, >100 GB free after the cleanup step).
      WORK: /home/runner/aegis-work
      OUT: arm64

    steps:
      - name: Start the job clock (budget math for the build step)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout this repository (workflow + patches + ci scripts)
        uses: actions/checkout@v4

      - name: Free up disk space (~25 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true            # Chromium downloads its own SDK/NDK; the preinstalled one is dead weight
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install JDK 17, atomic cc wrapper, and add 16 GB swap
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk > /dev/null
          # Atomic-output compile wrapper: every compiler -o target is written
          # to a temp file and renamed on success only. A build killed at the
          # cap (or stopped for banking) never leaves half-written objects.
          sudo gcc -O2 -o /usr/local/bin/aegis_atomic_cc \
            "$GITHUB_WORKSPACE/aegis/ci/atomic_cc.c"
          /usr/local/bin/aegis_atomic_cc echo "atomic wrapper: $(date)" >/dev/null \
            && echo "wrapper smoke test OK"
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
          echo "--- memory ---"; free -h
          echo "--- disk ---";  df -h /

      - name: Resolve Chromium version to build
        run: |
          set -e
          if [ -n "${{ github.event.inputs.chromium_version }}" ]; then
            VERSION="${{ github.event.inputs.chromium_version }}"
          else
            VERSION=$(curl -s "https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions?pageSize=1" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['versions'][0]['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WANT_CHROMIUM_TAG=$VERSION" >> "$GITHUB_ENV"
          echo "Building Chromium $VERSION for arm64"

      - name: Install depot_tools
        run: |
          set -e
          mkdir -p "$WORK"
          cd "$WORK"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$WORK/depot_tools" >> "$GITHUB_PATH"
          git config --global user.email "aegis@build.local"
          git config --global user.name  "Aegis Builder"

      - name: Fetch Chromium source (no history) + checkout target tag
        run: |
          set -e
          cd "$WORK"
          fetch --no-history --nohooks chromium
          echo "target_os = [ 'linux', 'android' ]" >> "$WORK/.gclient"
          cd "$WORK/src"
          git fetch --depth=1 origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          git checkout --detach "refs/tags/${VERSION}"
          cd "$WORK"
          gclient sync -D -j 4

      - name: Install build dependencies + run hooks (downloads Android SDK/NDK)
        run: |
          set -e
          (cd "$WORK/src" && bash build/install-build-deps.sh) \
            || echo "::warning::install-build-deps reported an error - continuing (runner usually ships the needed packages)"
          cd "$WORK"
          gclient runhooks -j 4

      - name: Restore banked build tree (draft-release volumes)
        id: restore
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/aegis/ci/bank.sh" restore android "$WORK/src" "$OUT"
        # no continue-on-error: a bank that exists but fails to restore must
        # RED the run (re-dispatch retries it), never silently seed-rebuild.

      - name: Apply Aegis patches (aegis/patches/*.patch)
        run: |
          set -e
          shopt -s nullglob
          patches=( "$GITHUB_WORKSPACE"/aegis/patches/*.patch )
          if [ ${#patches[@]} -gt 0 ]; then
            for p in $(printf '%s\n' "${patches[@]}" | sort); do
              echo "Applying $(basename "$p")"
              (cd "$WORK/src" && git apply --3way "$p" 2>/dev/null) \
                || (cd "$WORK/src" && git apply "$p") \
                || { echo "::error::Patch failed: $p"; exit 1; }
            done
          else
            echo "No patches found - building vanilla Chromium with Aegis branding hooks only."
          fi

      - name: Run branding hook (aegis/branding/apply.sh)
        run: |
          if [ -f "$GITHUB_WORKSPACE/aegis/branding/apply.sh" ]; then
            bash "$GITHUB_WORKSPACE/aegis/branding/apply.sh" "$WORK/src"
          else
            echo "No branding hook - APK will keep Chromium package identity."
          fi

      - name: Generate build files (low-RAM gn args)
        run: |
          set -e
          cd "$WORK/src"
          gn gen "out/$OUT" "--args=$(cat "$GITHUB_WORKSPACE/aegis/ci/arm64.gn")"
          gn args "out/$OUT" --list --short > /dev/null
          # mark which Chromium tag + Aegis overlay this tree was built from
          AEGIS_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          echo "$VERSION $AEGIS_SHA" > "out/$OUT/.aegis_head"
          echo "AEGIS_HEAD_SHA=$AEGIS_SHA" >> "$GITHUB_ENV"

      - name: Surgically invalidate outputs of changed patches
        run: |
          # restore_tree.py compares the bank's .aegis_head (chromium tag +
          # aegis overlay sha) with the current values: tag mismatch or
          # ci/branding changes drop the bank; patch changes map to the
          # chromium files they touch via `ninja -t deps` and delete ONLY
          # the outputs that depend on them. Runs after gn gen because it
          # needs build.ninja. Always exits 0.
          python3 "$GITHUB_WORKSPACE/aegis/ci/restore_tree.py" \
            "$WORK/src" "$OUT" "$GITHUB_WORKSPACE" "$VERSION"

      - name: Build with a time budget (graceful SIGINT stop for banking)
        run: |
          set +e
          cd "$WORK/src"
          NOW=$(date +%s)
          ELAPSED=$(( NOW - ${JOB_START:-NOW} ))
          BUDGET=$(( 350*60 - ELAPSED - 35*60 ))     # 35 min reserve: bank + summary
          [ "$BUDGET" -gt $(( 295*60 )) ] && BUDGET=$(( 295*60 ))
          [ "$BUDGET" -lt $(( 60*60 )) ]  && BUDGET=$(( 60*60 ))
          echo "Build budget: $(( BUDGET / 60 )) min (elapsed $(( ELAPSED / 60 )) min)"
          timeout --preserve-status -s INT -k 120 "${BUDGET}s" \
            autoninja -C "out/$OUT" "${{ github.event.inputs.build_target }}"
          RC=$?
          DUR=$(( $(date +%s) - NOW ))
          echo "ninja rc=$RC after $(( DUR / 60 )) min"
          if [ "$RC" -eq 0 ]; then
            echo "BUILD_DONE=1" >> "$GITHUB_ENV"
          elif [ "$DUR" -ge $(( BUDGET - 45 )) ]; then
            echo "BUILD_REASON=cap" >> "$GITHUB_ENV"
          else
            echo "BUILD_REASON=error" >> "$GITHUB_ENV"
          fi
          echo "NINJA_EDGES=$(wc -l < "out/$OUT/.ninja_log" 2>/dev/null || echo 0)" >> "$GITHUB_ENV"

      - name: Bank the build tree (cap reached or error - next run resumes)
        if: env.BUILD_DONE != '1'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$GITHUB_WORKSPACE/aegis/ci/bank.sh" save android "$WORK/src" "$OUT"
        # no continue-on-error: a failed bank must RED the run (previous
        # generation stays intact) instead of ending GREEN with no bank.

      - name: Fail loudly on a real build error (compile/link failure)
        if: env.BUILD_REASON == 'error'
        run: |
          echo "::error::Build stopped early for a non-cap reason (compile error or crash)."
          echo "::error::The build tree was banked; fix the error and re-dispatch."
          exit 1

      - name: Sign APK with the release keystore
        if: env.BUILD_DONE == '1'
        env:
          KS_B64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS:  ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS:  ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd "$WORK/src"
          APK_IN="out/$OUT/apks/ChromePublic.apk"
          test -f "$APK_IN" || { echo "::error::$APK_IN not found"; exit 1; }
          # Fail with a readable message instead of a cryptic apksigner error
          # when signing secrets are missing.
          test -n "$KS_B64"  || { echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          test -n "$KS_ALIAS" || { echo "::error::secret ANDROID_KEY_ALIAS is not set"; exit 1; }
          test -n "$KS_PASS" || { echo "::error::secret ANDROID_KEYSTORE_PASSWORD is not set"; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::secret ANDROID_KEY_PASSWORD is not set"; exit 1; }
          echo "$KS_B64" | base64 -d > /tmp/aegis.keystore
          ZIPALIGN=$(ls -1 third_party/android_sdk/public/build-tools/*/zipalign  | sort | tail -1)
          APKSIGNER=$(ls -1 third_party/android_sdk/public/build-tools/*/apksigner | sort | tail -1)
          "$ZIPALIGN" -f -p 4 "$APK_IN" /tmp/aegis-aligned.apk
          OUT_FILE="AegisBrowser_${VERSION}_arm64_r${GITHUB_RUN_NUMBER}.apk"
          "$APKSIGNER" sign --ks /tmp/aegis.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass "env:KS_PASS" --key-pass "env:KEY_PASS" --out "$OUT_FILE" /tmp/aegis-aligned.apk
          "$APKSIGNER" verify --print-certs "$OUT_FILE"
          cp "$OUT_FILE" "$GITHUB_WORKSPACE/"
          echo "APK_NAME=$OUT_FILE" >> "$GITHUB_ENV"

      - name: Upload APK artifact (kept 1 day, just in case)
        if: env.BUILD_DONE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ github.workspace }}/${{ env.APK_NAME }}
          retention-days: 1

      - name: Attach APK to a draft GitHub Release
        if: env.BUILD_DONE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --draft \
            --title "Aegis Browser - Chromium ${VERSION} (arm64)" \
            --notes "Automated free build from GitHub Actions. Chromium ${VERSION}, target_cpu=arm64, unofficial build (no LTO/PGO). Sideload: enable 'Install unknown apps', then install the APK." \
            "$GITHUB_WORKSPACE/${{ env.APK_NAME }}"
          echo "Draft release created: $TAG"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Aegis build summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Chromium | ${VERSION:-n/a} |"
            echo "| Target | ${{ github.event.inputs.build_target }} (arm64) |"
            echo "| Runner | ubuntu-24.04 hosted (4 vCPU / 16 GB) |"
            echo "| Outcome | ${BUILD_DONE:+APK built}${BUILD_REASON:+stopped early ($BUILD_REASON), tree banked} |"
            echo "| Ninja edges logged | ${NINJA_EDGES:-n/a} |"
            echo "| APK | ${APK_NAME:-not produced} |"
          } >> "$GITHUB_STEP_SUMMARY"
