# Aegis Browser - address-bar search suggestions OFF by default.
# Rationale: suggestions send every keystroke to the search provider.
# Ground truth: chrome/browser/profiles/profile.cc at tag 156.0.8078.79.
PATCH_ENABLED=1
PATCH_NUMBER=020
PATCH_SLUG="search-suggest-off"
PATCH_DESC="Search suggestions off by default (keystrokes stay on device; user can re-enable)."

EDIT1_FILE="chrome/browser/profiles/profile.cc"
EDIT1_GREP='prefs::kSearchSuggestEnabled,'
EDIT1_OLD='  registry->RegisterBooleanPref(
      prefs::kSearchSuggestEnabled,
      true,
      user_prefs::PrefRegistrySyncable::SYNCABLE_PREF);'
EDIT1_NEW='  registry->RegisterBooleanPref(
      prefs::kSearchSuggestEnabled,
      false,  // Aegis: search suggestions off by default
      user_prefs::PrefRegistrySyncable::SYNCABLE_PREF);'
EDIT_COUNT=1
