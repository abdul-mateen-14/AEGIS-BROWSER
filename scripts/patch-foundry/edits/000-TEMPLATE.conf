# ---------------------------------------------------------------------------
# Patch Foundry spec TEMPLATE - copy to e.g. 010-my-change.conf and edit.
# Processed by: scripts/patch-foundry/gen-aegis-patches.sh
#
# PATCH_ENABLED=0 keeps this template inert. Set to 1 to activate.
#
# Conventions
#   * PATCH_NUMBER: 3-digit order marker; CI applies patches alphabetically.
#   * One concern per patch. Keep edits small; they must survive rebasing
#     onto the next Chromium stable tag every ~4 weeks.
#   * EDITn_GREP must match EXACTLY ONCE in the file (the engine enforces
#     this - a wrong anchor aborts loudly instead of corrupting a patch).
#   * EDITn_OLD / EDITn_NEW are LITERAL text (no regex). Real newlines are
#     allowed inside bash single quotes. If the text contains a single
#     quote, use double quotes and escape \$ \` \" as needed.
#   * ADDn_SRC copies additions/<file> into the tree at ADDn_DEST. New files
#     need no anchor and are the preferred way to add Aegis code (see the
#     sync client in android-sync/java).
# ---------------------------------------------------------------------------

PATCH_ENABLED=0
PATCH_NUMBER=010
PATCH_SLUG="example-change"
PATCH_DESC="Example: force a pref default (delete me after reading)."

# --- Example edit (anchored literal replacement) ---------------------------
