# EDIT1_GREP='boolean EXAMPLE_DEFAULT = true;'
# EDIT1_OLD='boolean EXAMPLE_DEFAULT = true;'
# EDIT1_NEW='boolean EXAMPLE_DEFAULT = false;  // Aegis: hardened default'
# EDIT_COUNT=1

