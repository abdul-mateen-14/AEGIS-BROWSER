EDIT3_NEW='  DCHECK(request);

  // Aegis Shield: drop third-party ad/tracker requests (EasyList +
  // EasyPrivacy hosts; see services/network/aegis_shield.h for policy).
  if (aegis::AegisShield::ShouldBlock(request->url(), request->initiator())) {
    return net::ERR_BLOCKED_BY_CLIENT;
  }

  auto* const loader = URLLoader::ForRequest(*request);'
