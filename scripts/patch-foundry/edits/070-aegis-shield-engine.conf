# Aegis Browser - Aegis Shield v1: network-level ad/tracker blocking.
# A small static engine in the network service drops third-party requests
# to EasyList+EasyPrivacy hosts with ERR_BLOCKED_BY_CLIENT (the same error
# adblock extensions produce). Browser-initiated and same-party requests
# always pass; the Aegis ecosystem/sync domains are hard-allowlisted.
# Ground truth at tag 156.0.8078.79:
#   - services/network/network_service_network_delegate.h declares
#     OnBeforeURLRequest (net::NetworkDelegateImpl) - the .cc returns
#     net::OK there today; returning ERR_BLOCKED_BY_CLIENT blocks.
#   - net::URLRequest::initiator() exists (url_request.h:404,
#     const std::optional<url::Origin>&) and net/url_request/url_request.cc
#     calls network_delegate()->NotifyBeforeURLRequest (line 633).
#   - services/network/BUILD.gn "network_change_manager.h" source line
#     verified count==1.
