# Aegis Browser - metrics reporting deterministic OFF at registration.
# Upstream seeds the default from GoogleUpdateSettings consent state; on an
# unofficial build that is noise. Force false (opt-in) for a deterministic,
# privacy-first default. Users can still enable it in settings.
# Ground truth: chrome/browser/browser_process_impl.cc at tag 156.0.8078.79.
PATCH_ENABLED=1
PATCH_NUMBER=040
PATCH_SLUG="metrics-off-by-default"
PATCH_DESC="UMA/metrics reporting registration default forced to false (opt-in only)."

EDIT1_FILE="chrome/browser/browser_process_impl.cc"
EDIT1_GREP='RegisterBooleanPref\(metrics::prefs::kMetricsReportingEnabled,'
EDIT1_OLD='  registry->RegisterBooleanPref(metrics::prefs::kMetricsReportingEnabled,
                                GoogleUpdateSettings::GetCollectStatsConsent());'
EDIT1_NEW='  registry->RegisterBooleanPref(metrics::prefs::kMetricsReportingEnabled,
                                false);  // Aegis: metrics reporting opt-in only'
EDIT_COUNT=1
