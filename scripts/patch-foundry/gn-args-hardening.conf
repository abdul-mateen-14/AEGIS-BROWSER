# Aegis Browser - hardening GN args (batch 1 of the Phase 2 series).
#
# These lines are APPENDED to aegis/ci/arm64.gn by you (not automatically) -
# but ONLY the ones verify-gn-args.sh confirms to exist in your checkout:
#
#     scripts/patch-foundry/verify-gn-args.sh /path/to/chromium/src
#
# GN args are declared in .gn/.gni files; when Chromium renames or removes
# one, gn gen fails with "Undefined arg" and the CI log names it. This
# verifier catches that BEFORE a 5-hour build, so keep the list honest:
# remove any line reported MISSING and check the suggested replacement.
#
# Semantics (why each line exists):
google_api_key = ""                  # no Google API key baked into the binary
google_default_client_id = ""        # no OAuth client (sign-in to Google off)
google_default_client_secret = ""    # ditto - de-Googled build, like Bromite
enable_mdns = false                  # no local-network mDNS discovery surface
enable_remoting = false              # no Chrome Remote Desktop host code
enable_soda = false                  # no on-device speech model (Live Caption) downloads
enable_nacl = false                  # no NativeClient (dropped upstream in newer tags)
enable_vr = false                    # no WebXR/VrServices glue (may be gone upstream)
